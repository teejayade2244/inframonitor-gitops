# IMPORTANT - subject format not fully verified, see the confidence assessment given alongside
# this file when it was added. Confirmed via `az aks show` that this cluster uses Microsoft
# Entra ID authentication with native Kubernetes RBAC (aadProfile.enableAzureRbac: false), so
# Role/RoleBinding objects like this ARE the correct governing mechanism here (not moot, as they
# would be under Azure RBAC for Kubernetes Authorization mode). Microsoft's docs confirm
# "kind: User" + objectId as the subject format for human Entra ID users (cross-tenant) and
# "kind: Group" + objectId for groups, and separately confirm managed identities are a
# legitimate, supported way to authenticate to this exact cluster type (kubelogin's `-l msi` /
# `-l workloadidentity` modes). What's NOT explicitly confirmed in official docs: whether a
# managed identity's authenticated session maps to the SAME "kind: User" + objectId subject
# format as a human user, or something else. Recommend verifying empirically (e.g. `kubectl auth
# can-i get pods -n inframonitor --as <principalId>` won't work for a real non-human token check,
# but a real smoke-test run with kubelogin's msi mode against this RoleBinding will conclusively
# confirm or refute it) before depending on this in a real CI pipeline.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-test-reader
  namespace: inframonitor
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-test-reader-binding
  namespace: inframonitor
subjects:
  - kind: User
    name: {{ .Values.ciSmokeTestPrincipalId | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: smoke-test-reader
  apiGroup: rbac.authorization.k8s.io
