apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-test-reader
  namespace: inframonitor
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
# One shared Role (not per-service): pod names carry a rollout-specific hash suffix that changes
# every deploy, so this can't be scoped to a specific resourceName per service the way the
# ArgoCD refresh permission below can - namespace-bound read/portforward is the practical
# least-privilege boundary regardless of which service a given smoke-test identity belongs to.
# Every identity in ciSmokeTestIdentitiesStaging gets the same access via multiple subjects on
# this one RoleBinding, rather than a Role/RoleBinding pair duplicated per service.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-test-reader-binding
  namespace: inframonitor
subjects:
  {{- range $service, $principalId := .Values.ciSmokeTestIdentitiesStaging }}
  - kind: User
    name: {{ $principalId | quote }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
roleRef:
  kind: Role
  name: smoke-test-reader
  apiGroup: rbac.authorization.k8s.io
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-test-reader
  namespace: inframonitor-production
rules:
  - apiGroups: ["", "apps"]
