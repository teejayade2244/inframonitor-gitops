apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-test-reader
  namespace: inframonitor
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-test-reader-binding
  namespace: inframonitor
subjects:
  - kind: User
    name: {{ .Values.ciSmokeTestPrincipalId | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: smoke-test-reader
  apiGroup: rbac.authorization.k8s.io
---
# Duplicated (not merged into a single namespaced Role, since Roles are namespace-scoped and
# can't span two namespaces) for inframonitor-production - same identity, same rules, only the
# namespace differs, so the production smoke test job in
# events-service-production-promotion.yml has the same pod-read/portforward access staging
# already had.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-test-reader
  namespace: inframonitor-production
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-test-reader-binding
  namespace: inframonitor-production
subjects:
  - kind: User
    name: {{ .Values.ciSmokeTestPrincipalId | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: smoke-test-reader
  apiGroup: rbac.authorization.k8s.io
