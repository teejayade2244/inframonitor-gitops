namespaces:
  - inframonitor
  - inframonitor-production

# Which smoke-test identities get CI RBAC access, and in which environment - split into two flat
# maps (rather than one map with a nested environments list) so each template block's data
# source is obviously scoped to what it grants: the inframonitor-namespace Role/RoleBinding pair
# and the ArgoCD Application refresh permission for staging come from
# ciSmokeTestIdentitiesStaging; production from ciSmokeTestIdentitiesProduction. A service only
# needs an entry in the map(s) for the environment(s) its smoke test actually covers.
ciSmokeTestIdentitiesStaging:
  events-service: "37ea29f7-4b13-40af-a08c-1cdebc4df895"
  incidents-service: "07ee7787-e446-46fc-803f-5282cad0362f"
  create-incident-job: "ede3907c-77e6-4c2b-be9a-def3ea80f3ab"
ciSmokeTestIdentitiesProduction:
  events-service: "37ea29f7-4b13-40af-a08c-1cdebc4df895"
  incidents-service: "07ee7787-e446-46fc-803f-5282cad0362f"
  create-incident-job: "ede3907c-77e6-4c2b-be9a-def3ea80f3ab"
