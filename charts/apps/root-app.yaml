apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inframonitor-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/teejayade2244/inframonitor-gitops.git
    targetRevision: main
    path: charts/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true