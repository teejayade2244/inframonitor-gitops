apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidents-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/teejayade2244/inframonitor-gitops.git
    targetRevision: main
    path: charts/incidents-service
  destination:
    server: https://kubernetes.default.svc
    namespace: inframonitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true