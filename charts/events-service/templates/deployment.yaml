apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Kubernetes defaults this to 10 when unset - each rollout keeps that many old ReplicaSets
  # around (scaled to 0) to support kubectl rollout undo/history. Harmless (zero replicas, zero
  # compute) but noisy in ArgoCD's resource tree, especially with this project's deploy cadence.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: events-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: COSMOS_ENDPOINT
              value: "{{ .Values.env.COSMOS_ENDPOINT }}"
            - name: COSMOS_DATABASE
              value: "{{ .Values.env.COSMOS_DATABASE }}"
            - name: SERVICEBUS_NAMESPACE
              value: "{{ .Values.env.SERVICEBUS_NAMESPACE }}"
            - name: SERVICEBUS_TOPIC
              value: "{{ .Values.env.SERVICEBUS_TOPIC }}"
            - name: AZURE_CLIENT_ID
              value: "{{ .Values.env.AZURE_CLIENT_ID }}"
          # Without this, Kubernetes marks the container Ready as soon as the process starts,
          # not when it's actually listening - server.js does appInsights/dotenv setup and
          # module loading before app.listen(), a real window where Ready is true but nothing
          # answers the port yet. Confirmed via a live smoke-test run: kubectl port-forward hit
          # "connection refused" against a pod already reporting Ready. Affects real traffic too,
          # not just the smoke test - the Service routes to any Ready pod.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}