# Shared, non-environment-specific defaults only. Merged with values-staging.yaml or
# values-production.yaml at install/upgrade time via -f - everything that differs (or could
# ever plausibly differ) between environments lives in those files instead.
image:
  repository: inframonitoraksacr.azurecr.io/create-incident-job
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
