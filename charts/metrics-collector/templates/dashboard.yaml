        {
          "type": "row",
          "title": "Trends",
          "gridPos": { "x": 0, "y": 15, "w": 24, "h": 1 },
          "id": 200,
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Deployment Frequency (per day)",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "id": 10,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "dora_deployment_frequency_per_day", "legendFormat": "{{ `{{service}}` }}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "none" } }
        },
        {
          "type": "timeseries",
          "title": "Change Failure Rate",
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 8 },
          "id": 11,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "dora_change_failure_rate", "legendFormat": "{{ `{{service}}` }}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 } }
        },
        {
          "type": "timeseries",
          "title": "MTTR",
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 8 },
          "id": 12,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "dora_mttr_seconds", "legendFormat": "{{ `{{service}}` }}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "row",
          "title": "Pipeline Performance",
          "gridPos": { "x": 0, "y": 40, "w": 24, "h": 1 },
          "id": 300,
          "collapsed": false
        },
        {
          "type": "table",
          "title": "events-service - job timing (last 7 days)",
          "gridPos": { "x": 0, "y": 41, "w": 24, "h": 10 },
          "id": 20,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "pipeline_job_duration_avg_seconds{service=\"events-service\"}", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "refId": "B", "expr": "pipeline_job_duration_p95_seconds{service=\"events-service\"}", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "refId": "C", "expr": "pipeline_job_success_rate{service=\"events-service\"}", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "job_name", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "job": true, "job 1": true, "job 2": true, "job 3": true, "instance": true, "instance 1": true, "instance 2": true, "instance 3": true, "service": true, "service 1": true, "service 2": true, "service 3": true, "__name__": true, "__name__ 1": true, "__name__ 2": true, "__name__ 3": true },
                "renameByName": { "job_name": "Job", "Value #A": "Avg Duration (s)", "Value #B": "P95 Duration (s)", "Value #C": "Success Rate" }
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "P95 Duration (s)", "desc": true }] } }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "Avg Duration (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 1 }] },
              { "matcher": { "id": "byName", "options": "P95 Duration (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 1 }] },
              {
                "matcher": { "id": "byName", "options": "Success Rate" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.8 }, { "color": "green", "value": 0.95 }] } }
                ]
              }
            ]
          }
