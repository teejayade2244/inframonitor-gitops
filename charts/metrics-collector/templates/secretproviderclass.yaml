# First use of the Key Vault CSI driver in this project - every other workload here reaches
# Azure resources through Workload Identity alone, no secret material mounted at all. This one
# needs a real, durable GitHub PAT (no ambient GITHUB_TOKEN exists outside a GitHub Actions
# run), so it's the first genuine secret-delivery need.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: metrics-collector-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "{{ .Values.env.AZURE_CLIENT_ID }}"
    tenantId: "{{ .Values.keyVault.tenantId }}"
    keyvaultName: {{ .Values.keyVault.name }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.githubPatSecretName }}
          objectType: secret
  # The CSI driver only syncs this K8s Secret into existence while a pod actually has the
  # volume mounted - the app itself never reads the mounted file path, it reads GH_TOKEN as a
  # normal env var via secretKeyRef, same shape every other env var in the CronJob spec uses.
  secretObjects:
    - secretName: {{ .Values.keyVault.githubPatSecretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.githubPatSecretName }}
          key: GH_TOKEN
